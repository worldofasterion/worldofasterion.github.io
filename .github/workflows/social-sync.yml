name: Asterion social updates

on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: Europe/Prague
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = read without publishing; update = sync and publish; rebuild = test Pages deployment only'
        type: choice
        options: [check, update, rebuild]
        default: check
  push:
    branches: [main]
    paths: ['.github/workflows/social-sync.yml', 'tools/*.cjs', 'tests/*.cjs', 'assets/social-cloud.js']

permissions:
  contents: read

concurrency:
  group: asterion-social-updates
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs

  sync:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'rebuild' || github.event_name == 'schedule' && vars.SOCIAL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check connection configuration
        id: config
        run: node tools/social-sync.cjs --check-config
        env:
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          STRICT_CONFIG: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      - name: Read sources and prepare public content
        id: sync
        if: steps.config.outputs.ready == 'true'
        run: node tools/social-sync.cjs ${{ inputs.mode == 'check' && '--check' || '--apply' }}
        env:
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          PATREON_AUTO_REFRESH: ${{ inputs.mode != 'check' && vars.PATREON_AUTO_REFRESH || 'false' }}
          PATREON_CLIENT_ID: ${{ secrets.PATREON_CLIENT_ID }}
          PATREON_CLIENT_SECRET: ${{ secrets.PATREON_CLIENT_SECRET }}
          PATREON_REFRESH_TOKEN: ${{ secrets.PATREON_REFRESH_TOKEN }}
          SOCIAL_SECRETS_WRITER: ${{ secrets.SOCIAL_SECRETS_WRITER }}
      - name: Test proposed update
        if: steps.config.outputs.ready == 'true'
        run: node --test tests/*.test.cjs
      - name: Publish verified data changes
        id: commit
        if: steps.sync.outputs.changed == 'true' && inputs.mode != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git config user.name 'Asterion updates'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social-cloud.js index.html
          if [ -d assets/social-materials ]; then git add assets/social-materials; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public Patreon and Facebook materials'
          gh auth setup-git --hostname github.com
          git push origin HEAD:main
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [tests, sync]
    if: always() && needs.tests.result == 'success' && (needs.sync.outputs.commit != '' || github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.sync.outputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and verify production Pages
        run: node tools/pages-build.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.sync.outputs.commit || github.sha }}
